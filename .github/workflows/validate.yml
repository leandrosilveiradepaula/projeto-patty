name: Validate application

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Deterministic method tests
        run: npm run test:method

      - name: Protocol lifecycle tests
        run: npm run test:protocol

      - name: Content release tests
        run: npm run test:content

      - name: Professional follow-up tests
        run: npm run test:follow-up

      - name: Assignment tests
        run: npm run test:assignments

      - name: Onboarding tests
        run: npm run test:onboarding

      - name: Anamnesis draft tests
        run: npm run test:anamnesis-draft

      - name: AI contract tests
        run: npm run test:ai

      - name: E2E helper tests
        run: npm run test:e2e-helpers

      - name: Boundary validation tests
        run: npm run test:validation

      - name: Security boundary regression tests
        run: npm run test:security-boundaries

      - name: Build
        run: npm run build
