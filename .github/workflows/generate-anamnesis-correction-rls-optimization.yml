name: Generate anamnesis correction RLS optimization migration

on:
  push:
    branches:
      - codex/optimize-anamnesis-correction-rls

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: codex/optimize-anamnesis-correction-rls
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create migration with project CLI
        run: |
          if find supabase/migrations -maxdepth 1 -type f -name '*_optimize_anamnesis_correction_rls.sql' | grep -q .; then
            exit 0
          fi
          ./node_modules/.bin/supabase migration new optimize_anamnesis_correction_rls

      - name: Commit generated migration
        run: |
          git add supabase/migrations
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: create anamnesis correction RLS optimization migration"
          git push origin HEAD:codex/optimize-anamnesis-correction-rls
