name: Generate Anamnesis draft delete trigger fix

on:
  push:
    branches:
      - codex/fix-anamnesis-draft-delete-trigger

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/fix-anamnesis-draft-delete-trigger

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create migration with project CLI
        run: |
          if find supabase/migrations -maxdepth 1 -type f -name '*_fix_anamnesis_draft_delete_trigger.sql' | grep -q .; then
            exit 0
          fi
          ./node_modules/.bin/supabase migration new fix_anamnesis_draft_delete_trigger

      - name: Commit generated migration
        run: |
          git add supabase/migrations
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: create Anamnesis draft delete trigger migration"
          git push origin HEAD:codex/fix-anamnesis-draft-delete-trigger
