name: Update Next.js security patch

on:
  push:
    branches:
      - codex/nextjs-security-16-3-6

permissions:
  contents: write

jobs:
  update-next:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: codex/nextjs-security-16-3-6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install patched Next.js
        run: npm install --save-exact next@16.3.6

      - name: Commit package metadata
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: upgrade Next.js to 16.3.6"
          git push origin HEAD:codex/nextjs-security-16-3-6
