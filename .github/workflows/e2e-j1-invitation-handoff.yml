name: J1 administrative handoff - manual evidence pending

# Patty is the only production administrator. Do not run automated admin
# browser authentication with her personal password or MFA seed in GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-manual-evidence:
    if: github.repository == 'leandrosilveiradepaula/projeto-patty' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record human-admin blocker without using credentials
        shell: bash
        run: |
          echo "J1.01 and J1.05-07: BLOCKED - authorized Patty session required."
          echo "Never set E2E_ADMIN_TOTP_SECRET with Patty personal MFA in GitHub."
          echo "No automatic admin access or synthetic database mutation was attempted."
          echo "Only the independent synthetic-client J1 smoke may run automatically."
          {
            echo "### J1 administrative journey is NOT HOMOLOGATED"
            echo "No admin browser test was executed."
            echo "Patty is the sole administrator in production; professional actions need authorized human evidence."
            echo "The synthetic-client Playwright test is a separate workflow."
          } >> "$GITHUB_STEP_SUMMARY"
