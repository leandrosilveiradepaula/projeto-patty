name: Deploy Supabase migrations

on:
  push:
    branches:
      - master
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-migrations.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview pending migrations or apply them to production"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: "For apply mode, type APPLY exactly"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_ID: hqanoskwjvpbgavppcud

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned project dependencies
        run: npm ci

      - name: Validate deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Require explicit apply confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "APPLY" || {
            echo "Apply mode requires confirmation=APPLY"
            exit 1
          }

      - name: Link production Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Supabase CLI's linked pooler lookup is best-effort and may fail with
      # HTTP 403 for a scoped token. Keep the IPv4 session pooler hostname in
      # a NON-SECRET repository variable, obtained from Dashboard > Connect.
      # Never place database passwords or full connection URLs in the repo.
      - name: Configure validated IPv4 session pooler
        shell: bash
        env:
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const ref = process.env.SUPABASE_PROJECT_ID;
          const host = (process.env.SUPABASE_POOLER_HOST || '').trim().toLowerCase();
          if (!/^[a-z0-9]{20}$/.test(ref || '')) {
            throw new Error('Invalid project ref');
          }
          if (!/^aws-[0-9]+-[a-z0-9-]+\.pooler\.supabase\.com$/.test(host)) {
            throw new Error('Set repository variable SUPABASE_POOLER_HOST to the validated hostname from Supabase Dashboard > Connect > Session pooler (hostname only, no URL/password)');
          }
          const url = 'postgresql://postgres.' + ref + '@' + host + ':5432/postgres';
          const output = 'supabase/.temp/pooler-url';
          fs.mkdirSync('supabase/.temp', { recursive: true });
          fs.writeFileSync(output, url, { mode: 0o600 });
          fs.chmodSync(output, 0o600);
          console.log('Validated IPv4 session pooler configuration (hostname omitted)');
          NODE

      - name: Show local and remote migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          npx supabase migration list 2>&1 | tee "$RUNNER_TEMP/patty-migration-history.txt"

      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db push --dry-run 2>&1 | tee "$RUNNER_TEMP/patty-migration-preview.txt"

      - name: Publish non-mutating migration preview in job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Supabase schema preview"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo ""
            echo "Preview is informational. No schema apply occurs on a push."
            for report in patty-migration-history.txt patty-migration-preview.txt; do
              if test -f "$RUNNER_TEMP/$report"; then
                echo ""
                echo "### $report"
                echo '~~~text'
                cat "$RUNNER_TEMP/$report"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply pending migrations
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && inputs.confirmation == 'APPLY'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push

      - name: Verify migration history after apply
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && inputs.confirmation == 'APPLY'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase migration list
