name: Deploy Supabase migrations

on:
  push:
    branches:
      - master
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-migrations.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview pending migrations or apply them to production"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: "For apply mode, type APPLY exactly"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_ID: hqanoskwjvpbgavppcud

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned project dependencies
        run: npm ci

      - name: Validate deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Require explicit apply confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "APPLY" || {
            echo "Apply mode requires confirmation=APPLY"
            exit 1
          }

      - name: Link production Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # supabase link treats pooler lookup as best-effort. A successful link
      # can therefore leave an IPv4-only runner with only the unreachable
      # direct IPv6 endpoint. Query the official read-only API explicitly.
      - name: Ensure validated IPv4 session pooler configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const ref = process.env.SUPABASE_PROJECT_ID;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          if (!/^[a-z0-9]{20}$/.test(ref || '') || !token) {
            throw new Error('Supabase project or API authentication is missing');
          }
          async function main() {
            const response = await fetch(
              'https://api.supabase.com/v1/projects/' + ref + '/config/database/pooler',
              { headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' } }
            );
            if (!response.ok) {
              throw new Error('Read-only pooler API failed (HTTP ' + response.status + ')');
            }
            const configs = await response.json();
            if (!Array.isArray(configs)) throw new Error('Invalid pooler metadata format');
            const primary = configs.find(item => item.database_type === 'PRIMARY');
            if (!primary || typeof primary.connection_string !== 'string') {
              throw new Error('Primary IPv4 pooler metadata was not returned');
            }
            // Follow the pinned CLI's own session-mode normalization.
            let value = primary.connection_string.replaceAll(':[YOUR-PASSWORD]', '');
            if (primary.pool_mode !== 'session') {
              value = value.replaceAll(':6543/', ':5432/');
            }
            const url = new URL(value);
            if (!['postgresql:', 'postgres:'].includes(url.protocol) ||
                !url.hostname.toLowerCase().endsWith('.pooler.supabase.com') ||
                url.port !== '5432' ||
                decodeURIComponent(url.username) !== 'postgres.' + ref ||
                url.password !== '' || url.pathname !== '/postgres') {
              throw new Error('Pooler endpoint failed strict project/host validation');
            }
            const output = 'supabase/.temp/pooler-url';
            fs.mkdirSync('supabase/.temp', { recursive: true });
            fs.writeFileSync(output, value, { mode: 0o600 });
            fs.chmodSync(output, 0o600);
            console.log('Verified IPv4 session pooler configuration (endpoint redacted)');
          }
          main().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Show local and remote migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          npx supabase migration list 2>&1 | tee "$RUNNER_TEMP/patty-migration-history.txt"

      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db push --dry-run 2>&1 | tee "$RUNNER_TEMP/patty-migration-preview.txt"

      - name: Publish non-mutating migration preview in job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Supabase schema preview"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo ""
            echo "Preview is informational. No schema apply occurs on a push."
            for report in patty-migration-history.txt patty-migration-preview.txt; do
              if test -f "$RUNNER_TEMP/$report"; then
                echo ""
                echo "### $report"
                echo '~~~text'
                cat "$RUNNER_TEMP/$report"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply pending migrations
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && inputs.confirmation == 'APPLY'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push

      - name: Verify migration history after apply
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && inputs.confirmation == 'APPLY'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase migration list
