name: Verify production security headers

on:
  push:
    branches:
      - codex/verify-production-security-headers

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify production response headers
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        shell: bash
        run: |
          set -u
          test -n "$E2E_BASE_URL" || { echo "Missing E2E_BASE_URL"; exit 1; }

          headers="$(mktemp)"
          curl --fail --silent --show-error --location \
            --output /dev/null \
            --dump-header "$headers" \
            "$E2E_BASE_URL/login"

          normalize() {
            tr -d '\r' < "$headers"
          }

          csp="$(normalize | awk -F': ' 'tolower($1)=="content-security-policy"{print $2}' | tail -1)"
          permissions="$(normalize | awk -F': ' 'tolower($1)=="permissions-policy"{print $2}' | tail -1)"
          referrer="$(normalize | awk -F': ' 'tolower($1)=="referrer-policy"{print $2}' | tail -1)"
          nosniff="$(normalize | awk -F': ' 'tolower($1)=="x-content-type-options"{print $2}' | tail -1)"
          frame="$(normalize | awk -F': ' 'tolower($1)=="x-frame-options"{print $2}' | tail -1)"

          failures=0
          check_contains() {
            label="$1"
            value="$2"
            expected="$3"
            if [[ "$value" == *"$expected"* ]]; then
              echo "$label: PASS"
            else
              echo "$label: FAIL"
              failures=$((failures + 1))
            fi
          }

          check_exact() {
            label="$1"
            value="$2"
            expected="$3"
            if [ "$value" = "$expected" ]; then
              echo "$label: PASS"
            else
              echo "$label: FAIL"
              failures=$((failures + 1))
            fi
          }

          check_contains "CSP base-uri" "$csp" "base-uri 'self'"
          check_contains "CSP frame-ancestors" "$csp" "frame-ancestors 'none'"
          check_contains "CSP form-action" "$csp" "form-action 'self'"
          check_contains "Permissions camera" "$permissions" "camera=()"
          check_contains "Permissions microphone" "$permissions" "microphone=()"
          check_contains "Permissions geolocation" "$permissions" "geolocation=()"
          check_contains "Permissions browsing-topics" "$permissions" "browsing-topics=()"
          check_exact "Referrer-Policy" "$referrer" "no-referrer"
          check_exact "X-Content-Type-Options" "$nosniff" "nosniff"
          check_exact "X-Frame-Options" "$frame" "DENY"

          exit "$failures"
