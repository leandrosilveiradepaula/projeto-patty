name: Diagnose production response layer

on:
  push:
    branches:
      - codex/verify-production-security-headers

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: List response status and header names only
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$E2E_BASE_URL" || { echo "Missing E2E_BASE_URL"; exit 1; }

          headers="$(mktemp)"
          curl --fail --silent --show-error --location \
            --output /dev/null \
            --dump-header "$headers" \
            "$E2E_BASE_URL/login"

          echo "HTTP status chain:"
          tr -d '\r' < "$headers" | awk '/^HTTP\// {print $2}'

          echo "Header names:"
          tr -d '\r' < "$headers" \
            | awk -F':' '/^[A-Za-z0-9-]+:/ {print tolower($1)}' \
            | sort -u
