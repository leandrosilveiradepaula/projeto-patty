name: Evaluate OpenAI anamnesis review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-openai-eval:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_EVAL_MODEL: "gpt-5.6-terra"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Validate OpenAI secret
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::Missing required repository secret: OPENAI_API_KEY"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run synthetic OpenAI evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run eval:ai:openai
