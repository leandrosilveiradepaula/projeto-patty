name: Generate private file migration

on:
  push:
    branches:
      - codex/private-file-access-foundation

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: codex/private-file-access-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create migration with project CLI
        run: |
          if find supabase/migrations -maxdepth 1 -type f -name '*_private_file_access_visibility_foundation.sql' | grep -q .; then
            exit 0
          fi
          ./node_modules/.bin/supabase migration new private_file_access_visibility_foundation

      - name: Commit generated migration
        run: |
          git add supabase/migrations
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: create private file access migration"
          git push origin HEAD:codex/private-file-access-foundation
