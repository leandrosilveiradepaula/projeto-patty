name: Validate method configuration foundation

on:
  pull_request:
    paths:
      - ".github/workflows/validate-method-configuration-foundation.yml"
      - "docs/METHOD_CONFIGURATION_FOUNDATION_MIGRATION_PROPOSAL_V2.sql"
      - "docs/METHOD_CONFIGURATION_FOUNDATION_PGTAP_PROPOSAL_V2.sql"
      - "supabase/migrations/**"
      - "supabase/tests/database/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Show pinned Supabase CLI
        run: npx supabase --version

      - name: Verify committed method configuration migrations
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20261001213333_create_method_configuration_foundation.sql
          test -f supabase/migrations/20261001230751_seed_initial_method_templates.sql
          test -f supabase/migrations/20261001235018_seed_higher_fat_protein_limit_template.sql
          test -f supabase/migrations/20261002005720_hydrate_client_targets_from_configuration.sql
          test -f supabase/tests/database/method_configuration_foundation_v2.test.sql
          test -f supabase/tests/database/method_configuration_initial_templates.test.sql
          test -f supabase/tests/database/method_configuration_higher_fat_protein_limit.test.sql
          test -f supabase/tests/database/method_configuration_hydration.test.sql
          test -f supabase/migrations/20261002195239_seed_next_method_templates_batch_a.sql
          test -f supabase/tests/database/method_configuration_batch_a.test.sql
          test -f supabase/migrations/20261002220812_seed_method_configuration_batch_b.sql
          test -f supabase/tests/database/method_configuration_carb_cycle.test.sql
          test -f supabase/tests/database/method_configuration_assessments.test.sql
          test -f supabase/tests/database/method_configuration_liquid_taxonomy.test.sql
          test -f supabase/migrations/20261002224033_snapshot_assessment_and_liquid_consumers.sql
          test -f supabase/tests/database/method_configuration_assessment_liquid_snapshots.test.sql
          test -f supabase/migrations/20261002231111_harden_snapshot_consumers.sql
          test -f supabase/tests/database/method_configuration_snapshot_consumer_hardening.test.sql
          test -f supabase/tests/database/method_configuration_version_activation.test.sql
          test -f supabase/tests/database/weekly_feedback_eligibility_schedule.test.sql
          test -f supabase/tests/database/weekly_feedback_private_save_lifecycle.test.sql
          test -f supabase/migrations/20261101121000_admin_global_read_aal2.sql
          test -f supabase/migrations/20261101124800_admin_global_professional_follow_up_insert.sql
          test -f supabase/tests/database/admin_global_professional_follow_up.test.sql
          echo "Committed method configuration migrations and pgTAP files found."

      - name: Start local Supabase
        run: npx supabase start

      - name: Reset local database with committed migration
        run: npx supabase db reset

      - name: Lint local database
        run: npx supabase db lint --level error

      - name: Run foundation pgTAP V2
        run: npx supabase test db supabase/tests/database/method_configuration_foundation_v2.test.sql

      - name: Run initial template pgTAP
        run: npx supabase test db supabase/tests/database/method_configuration_initial_templates.test.sql

      - name: Run higher-fat protein limit pgTAP
        run: npx supabase test db supabase/tests/database/method_configuration_higher_fat_protein_limit.test.sql

      - name: Run hydration compatibility pgTAP
        run: npx supabase test db supabase/tests/database/method_configuration_hydration.test.sql

      - name: Run Batch A method configuration pgTAP
        run: npx supabase test db supabase/tests/database/method_configuration_batch_a.test.sql

      - name: Run Carb Cycle configuration pgTAP
        run: npx supabase test db supabase/tests/database/method_configuration_carb_cycle.test.sql

      - name: Run assessment configuration pgTAP
        run: npx supabase test db supabase/tests/database/method_configuration_assessments.test.sql

      - name: Run liquid taxonomy configuration pgTAP
        run: npx supabase test db supabase/tests/database/method_configuration_liquid_taxonomy.test.sql

      - name: Run assessment and liquid snapshot pgTAP
        run: npx supabase test db supabase/tests/database/method_configuration_assessment_liquid_snapshots.test.sql

      - name: Run snapshot consumer hardening pgTAP
        run: npx supabase test db supabase/tests/database/method_configuration_snapshot_consumer_hardening.test.sql

      - name: Run method configuration activation pgTAP
        run: npx supabase test db supabase/tests/database/method_configuration_version_activation.test.sql

      - name: Run weekly feedback eligibility and schedule pgTAP
        run: npx supabase test db supabase/tests/database/weekly_feedback_eligibility_schedule.test.sql

      - name: Run weekly feedback authenticated save lifecycle pgTAP
        run: npx supabase test db supabase/tests/database/weekly_feedback_private_save_lifecycle.test.sql

      - name: Run AAL2 admin global manual weekly feedback pgTAP
        run: npx supabase test db supabase/tests/database/admin_global_manual_weekly_feedback.test.sql

      - name: Run admin global professional follow-up pgTAP
        run: npx supabase test db supabase/tests/database/admin_global_professional_follow_up.test.sql

      - name: Run admin global measurement correction pgTAP
        run: npx supabase test db supabase/tests/database/admin_global_measurement_correction.test.sql

      - name: Run admin global anamnesis review pgTAP
        run: npx supabase test db supabase/tests/database/admin_global_anamnesis_review.test.sql

      - name: Run historical anamnesis correction and clarification pgTAP
        run: npx supabase test db supabase/tests/database/admin_global_anamnesis_followup.test.sql

      - name: Run admin global check-in correction pgTAP
        run: npx supabase test db supabase/tests/database/admin_global_checkin_corrections.test.sql

      - name: Run historical internal Client registration pgTAP
        run: npx supabase test db supabase/tests/database/historical_client_internal_registration.test.sql

      - name: Run historical Client return request pgTAP
        run: npx supabase test db supabase/tests/database/historical_client_return_request.test.sql

      - name: Run initial-load ledger RLS and idempotency pgTAP
        run: npx supabase test db supabase/tests/database/historical_initial_load_ledger.test.sql

      - name: Run private historical Anamnesis staging pgTAP
        run: npx supabase test db supabase/tests/database/historical_anamnesis_private_staging.test.sql

      - name: Run private historical photo staging pgTAP
        run: npx supabase test db supabase/tests/database/historical_photo_private_staging.test.sql

      - name: Run private historical assessment staging pgTAP
        run: npx supabase test db supabase/tests/database/historical_assessment_private_staging.test.sql

      - name: Run admin global historical assessment lifecycle pgTAP
        run: npx supabase test db supabase/tests/database/admin_global_assessment_lifecycle.test.sql

      - name: Run admin global nutrition draft pgTAP
        run: npx supabase test db supabase/tests/database/admin_global_nutrition_drafts.test.sql

      - name: Run admin global nutrition human lifecycle pgTAP
        run: npx supabase test db supabase/tests/database/admin_global_nutrition_human_lifecycle.test.sql

      - name: Run legacy versioned training prescription pgTAP
        run: npx supabase test db supabase/tests/database/client_training_prescriptions_rls.test.sql

      - name: Run admin global training lifecycle pgTAP
        run: npx supabase test db supabase/tests/database/admin_global_training_lifecycle.test.sql

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
