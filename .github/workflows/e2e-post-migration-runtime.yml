name: E2E post-migration runtime smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-migration-runtime:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Validate E2E secrets
        shell: bash
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.E2E_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          for name in E2E_BASE_URL E2E_SUPABASE_SECRET_KEY; do
            test -n "${!name}" || { echo "::error::Missing required E2E secret: ${name}"; exit 1; }
          done

      - name: Install dependencies
        run: npm ci

      - name: Verify required versioned migrations are remotely recorded
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          npx supabase link --project-ref hqanoskwjvpbgavppcud
          npx supabase migration list | tee migration-list.txt
          grep -q 20261011063500 migration-list.txt || { echo "::error::Cycle migration missing"; exit 1; }
          grep -q 20261012150000 migration-list.txt || { echo "::error::Assessment migration missing"; exit 1; }

      - name: Create synthetic canonical client
        env:
          E2E_SUPABASE_URL: "https://hqanoskwjvpbgavppcud.supabase.co"
          E2E_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.E2E_SUPABASE_SECRET_KEY }}
        run: node e2e/setup-canonical-anamnesis-client.mjs

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify authenticated post-migration client journey
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_SUPABASE_URL: "https://hqanoskwjvpbgavppcud.supabase.co"
          E2E_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.E2E_SUPABASE_SECRET_KEY }}
        run: npx playwright test e2e/post-migration-runtime.spec.mjs --reporter=line

      - name: Cleanup synthetic canonical client
        if: always()
        env:
          E2E_SUPABASE_URL: "https://hqanoskwjvpbgavppcud.supabase.co"
          E2E_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.E2E_SUPABASE_SECRET_KEY }}
        run: node e2e/cleanup-canonical-anamnesis-client.mjs
