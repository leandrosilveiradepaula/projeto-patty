name: Generate Snapshot Consumer Hardening Migration Filename

on:
  pull_request:
    paths:
      - ".github/workflows/generate-snapshot-consumer-hardening-migration.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Generate migration filename with pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx supabase migration new harden_snapshot_consumers
          find supabase/migrations -maxdepth 1 -type f -name '*_harden_snapshot_consumers.sql' -print
