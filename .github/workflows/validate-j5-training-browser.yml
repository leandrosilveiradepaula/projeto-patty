name: Validate J5 local training lifecycle browser

on:
  pull_request:
    paths:
      - ".github/workflows/validate-j5-training-browser.yml"
      - "e2e/j5-training-lifecycle.spec.mjs"
      - "e2e/helpers/admin-auth.mjs"
      - "app/admin/exercicios/**"
      - "app/admin/clientes/[clienteId]/treino/**"
      - "app/cliente/treino/**"
      - "components/admin/AdminExerciseVersionVideoUpload.tsx"
      - "components/admin/AdminTraining**"
      - "components/client/ClientTraining**"
      - "components/client/ClientWorkoutGuide**"
      - "lib/training/**"
      - "lib/operations/exercise-version-private-video.test.ts"
      - "security/exercise-version-video-boundaries.test.mjs"
      - "supabase/migrations/*client_training*.sql"
      - "supabase/migrations/*training_draft*.sql"
      - "supabase/migrations/20261023205316_add_exercise_version_private_videos.sql"
      - "supabase/tests/database/exercise_version_videos_rls.test.sql"
      # Explicit all-journey regression only when the consolidated evidence matrix changes.
      - "docs/PREHOMOLOGATION_MATRIX.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j5-training-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training-lifecycle-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Enable disposable TOTP locally
        run: |
          node <<'NODE'
          const {readFileSync,writeFileSync}=require("node:fs");
          const p="supabase/config.toml",v=readFileSync(p,"utf8");
          const from="[auth.mfa.totp]\nenroll_enabled = false\nverify_enabled = false";
          const to="[auth.mfa.totp]\nenroll_enabled = true\nverify_enabled = true";
          if(v.split(from).length!==2)throw Error("Unknown local TOTP config");
          writeFileSync(p,v.replace(from,to));
          NODE
          git diff --check

      - name: Start disposable local Supabase
        run: npx supabase start

      - name: Reset database using committed migrations
        run: npx supabase db reset --local

      - name: Prove private exercise-video RLS in disposable PostgreSQL
        run: npx supabase test db --local supabase/tests/database/exercise_version_videos_rls.test.sql

      - name: Mirror hosted service-only assignment closure ACL in disposable database
        shell: bash
        run: |
          set -euo pipefail
          # Never add these grants to hosted Supabase or to browser roles.
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_SECRET_KEY:-}"
          docker exec -i supabase_db_projeto-patty psql -X -q -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $guard$
          begin
            if not exists (select 1 from pg_roles where rolname='service_role' and rolbypassrls)
               or not (select relrowsecurity from pg_class where oid='public.client_assignments'::regclass)
               or not (select relrowsecurity from pg_class where oid='public.clients'::regclass)
            then
              raise exception 'Unexpected disposable J5 assignment security boundary';
            end if;
          end $guard$;
          -- These permissions were confirmed read-only via hosted ACL metadata.
          grant select,update on public.client_assignments,public.clients to service_role;
          do $guard$
          begin
            if not has_table_privilege('service_role','public.client_assignments','SELECT')
               or not has_table_privilege('service_role','public.client_assignments','UPDATE')
               or not has_table_privilege('service_role','public.clients','SELECT')
               or not has_table_privilege('service_role','public.clients','UPDATE')
               or has_table_privilege('authenticated','public.client_assignments','UPDATE')
               or has_table_privilege('authenticated','public.clients','UPDATE')
               or has_table_privilege('anon','public.client_assignments','UPDATE')
               or has_table_privilege('anon','public.clients','UPDATE')
            then
              raise exception 'J5 service-only local parity failed';
            end if;
          end $guard$;
          SQL

      - name: Export disposable localhost runtime variables
        shell: bash
        run: |
          set -euo pipefail
          npx supabase status -o env > "$RUNNER_TEMP/j5-local-status"
          chmod 600 "$RUNNER_TEMP/j5-local-status"
          set -a
          source "$RUNNER_TEMP/j5-local-status"
          set +a
          test "$API_URL" = "http://127.0.0.1:54321"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_SECRET_KEY:-}"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          # Server-only local identity for the authenticated end-assignment action.
          # Never use a NEXT_PUBLIC_ prefix or remote project credentials.
          echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "J5_E2E_BASE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"

      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Build and start local production-mode Next.js
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/j5-next.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/j5-next.pid"
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/login >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::J5 disposable Next.js not ready"
          exit 1

      - name: Playwright J5 full training lifecycle
        env:
          J5_E2E_LOCAL_ONLY: "true"
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/j5-local-status"
          set +a
          export J5_E2E_SUPABASE_URL="$API_URL"
          export J5_E2E_ANON_KEY="$ANON_KEY"
          export J5_E2E_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npx playwright test e2e/j5-training-lifecycle.spec.mjs --reporter=line --workers=1

      - name: Classify errors without exposing logs or sensitive fields
        if: failure()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("node:fs");
          const file=process.env.RUNNER_TEMP+"/j5-next.log";
          const data=fs.existsSync(file)?fs.readFileSync(file,"utf8"):"";
          const codes=[...data.matchAll(/(?:code|sqlstate):\s*['"]?([A-Z0-9]{5})['"]?/gi)]
            .map(match=>match[1].toUpperCase());
          const known=["permission denied","infinite recursion","row-level security",
            "violates","TypeError","ReferenceError","statement timeout"];
          const categories=known.filter(value=>data.toLowerCase().includes(value.toLowerCase()));
          process.stdout.write("J5 server diagnostics: SQLSTATE="+
            (codes.length?[...new Set(codes)].join(","):"none-detected")+
            "; categories="+(categories.length?categories.join(","):"unclassified")+"\n");
          NODE

      - name: Destroy all disposable services
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/j5-next.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/j5-next.pid")" 2>/dev/null || true
          fi
          npx supabase stop --no-backup
          rm -f "$RUNNER_TEMP/j5-local-status" "$RUNNER_TEMP/j5-next.pid" "$RUNNER_TEMP/j5-next.log"
