name: E2E client onboarding activation smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-onboarding-activation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Validate E2E secrets
        shell: bash
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.E2E_SUPABASE_SECRET_KEY }}
        run: |
          missing=0
          for name in E2E_BASE_URL E2E_ADMIN_EMAIL E2E_SUPABASE_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret or reusable fallback: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production onboarding activation smoke test
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_SUPABASE_URL: "https://hqanoskwjvpbgavppcud.supabase.co"
          E2E_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.E2E_SUPABASE_SECRET_KEY }}
        run: npx playwright test e2e/client-onboarding-activation.spec.mjs --reporter=line
