name: "LEGADO BLOQUEADO - E2E admin anamnesis corrections smoke"

# Disabled by the documented production-only Patty administrator decision.
# Historical implementation remains accessible through Git history.
# It must not create synthetic identities/records, use production TOTP,
# alter assignments or upload private files in the hosted Supabase.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-smoke-blocked:
    if: github.repository == 'leandrosilveiradepaula/projeto-patty'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Block historical production E2E without loading secrets
        shell: bash
        run: |
          {
            echo "### BLOQUEADO: smoke legado de anamnese administrativa"
            echo ""
            echo "Este workflow NAO executa testes nem acessa credenciais do Supabase SaaS."
            echo "A decisao vigente proibe identidades sintéticas administrativas na producao e testes que alterem dados reais/historicos."
            echo "Use os workflows Validate J1-J7 com Supabase descartavel para cobertura tecnica."
            echo "Homologacao da Patty com sua sessao autorizada permanece a ultima etapa."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Legacy production E2E disabled; see docs/LEGACY_PRODUCTION_E2E_BLOCK.md"
          exit 1
