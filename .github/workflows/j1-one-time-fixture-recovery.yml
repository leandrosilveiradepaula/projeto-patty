name: J1 one-time exact synthetic orphan recovery

# Trusted master only. A purpose-built, time-limited cleanup for one
# read-only-audited synthetic orphan. Never executes PR head code.
on:
  workflow_run:
    workflows:
      - Validate application
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: patty-j1-exact-orphan-recovery
  cancel-in-progress: false

jobs:
  recover-known-fixture:
    if: >-
      github.repository == 'leandrosilveiradepaula/projeto-patty' &&
      github.ref == 'refs/heads/master' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted master, never a pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependency tree
        run: npm ci

      - name: Recover only the previously verified synthetic Auth and Client
        env:
          J1_EXACT_ORPHAN_RECOVERY: "true"
          E2E_SUPABASE_URL: https://hqanoskwjvpbgavppcud.supabase.co
          E2E_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.E2E_SUPABASE_SECRET_KEY }}
        run: node e2e/helpers/j1-onetime-orphan-recovery.mjs
