name: Validate J3 local assessment browser journey

# A synthetic full-browser journey. No external secrets, SaaS access or real data.
on:
  pull_request:
    paths:
      - ".github/workflows/validate-j3-assessment-browser.yml"
      - "e2e/j3-assessment-evolution-lifecycle.spec.mjs"
      - "e2e/helpers/admin-auth.mjs"
      - "app/admin/clientes/[clienteId]/evolucao/**"
      - "app/admin/clientes/[clienteId]/avaliacoes/**"
      - "app/admin/avaliacoes/[avaliacaoId]/**"
      - "lib/evaluations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j3-local-assessment-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assessment-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned application dependencies
        run: npm ci

      - name: Enable MFA in disposable Supabase only
        run: |
          node <<'NODE'
          const {readFileSync,writeFileSync}=require("node:fs");
          const path="supabase/config.toml";
          const txt=readFileSync(path,"utf8");
          const before="[auth.mfa.totp]\nenroll_enabled = false\nverify_enabled = false";
          const after="[auth.mfa.totp]\nenroll_enabled = true\nverify_enabled = true";
          if (txt.split(before).length !== 2) throw new Error("Unexpected local MFA config");
          writeFileSync(path,txt.replace(before,after));
          NODE
          git diff --check

      - name: Start disposable Supabase
        run: npx supabase start

      - name: Apply committed migrations to local database
        run: npx supabase db reset

      - name: Export ephemeral public credentials
        shell: bash
        run: |
          set -euo pipefail
          npx supabase status -o env > "$RUNNER_TEMP/j3-local-status"
          chmod 600 "$RUNNER_TEMP/j3-local-status"
          set -a
          source "$RUNNER_TEMP/j3-local-status"
          set +a
          test "$API_URL" = "http://127.0.0.1:54321"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "J3_E2E_BASE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"

      - name: Install Chromium on disposable runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Next.js login
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/j3-next.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/j3-next.pid"
          for attempt in $(seq 1 90); do
            if curl --max-time 3 -fsS http://127.0.0.1:3000/login > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Local Next.js never became ready"
          tail -n 40 "$RUNNER_TEMP/j3-next.log"
          exit 1

      - name: Playwright authenticated J3 lifecycle with synthetic private photos
        env:
          J3_E2E_LOCAL_ONLY: "true"
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/j3-local-status"
          set +a
          export J3_E2E_SUPABASE_URL="$API_URL"
          export J3_E2E_ANON_KEY="$ANON_KEY"
          export J3_E2E_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npx playwright test e2e/j3-assessment-evolution-lifecycle.spec.mjs --reporter=line --workers=1

      - name: Destroy disposable Supabase and Next.js
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/j3-next.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/j3-next.pid")" 2>/dev/null || true
          fi
          npx supabase stop --no-backup || true
          rm -f "$RUNNER_TEMP/j3-next.pid" "$RUNNER_TEMP/j3-local-status"

      - name: Explain scope
        if: always()
        run: |
          echo "J3 E2E uses only disposable local Supabase with synthetic measurements and photos."
          echo "Production credentials, real patients and professional homologation are not involved."
