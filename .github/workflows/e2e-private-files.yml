name: E2E private files smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-files-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate E2E secrets
        shell: bash
        run: |
          missing=0
          for name in E2E_BASE_URL E2E_CLIENT_EMAIL E2E_CLIENT_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production private-file smoke test
        run: npx playwright test e2e/client-private-files.mjs --reporter=line
