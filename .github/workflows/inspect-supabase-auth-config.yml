name: Diagnose Supabase invite template update

on:
  push:
    branches:
      - codex/inspect-supabase-auth-config

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_ID: hqanoskwjvpbgavppcud

    steps:
      - name: Capture template update API error
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }

          template='<h2>Ative sua conta</h2><p>Use o link abaixo para ativar seu acesso.</p><p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite">Ativar conta</a></p>'
          body="$(jq -n --arg template "$template" '{mailer_templates_invite_content:$template}')"
          response_file="$(mktemp)"

          status="$(curl --silent --show-error \
            -o "$response_file" \
            -w '%{http_code}' \
            -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$body")"

          echo "HTTP status: $status"
          echo "API response:"
          jq '{message, error, code}' "$response_file" 2>/dev/null || cat "$response_file"

          test "$status" = "200"
