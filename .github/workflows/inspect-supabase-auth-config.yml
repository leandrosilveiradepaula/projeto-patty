name: Inspect Supabase Auth config

on:
  push:
    branches:
      - codex/inspect-supabase-auth-config

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_ID: hqanoskwjvpbgavppcud

    steps:
      - name: Inspect non-secret Auth security fields
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }

          config="$(curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"

          echo "Auth config keys matching password/hibp:"
          printf '%s' "$config" | jq -r 'keys[] | select(test("password|hibp"; "i"))'

          echo "Selected non-secret Auth fields:"
          printf '%s' "$config" | jq 'with_entries(
            select(
              (.key | test("password|hibp"; "i"))
              and (.key | test("secret|token|key|smtp"; "i") | not)
            )
          )'
