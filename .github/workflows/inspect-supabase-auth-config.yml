name: Configure Supabase invite template

on:
  push:
    branches:
      - codex/inspect-supabase-auth-config

permissions:
  contents: read

jobs:
  configure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_ID: hqanoskwjvpbgavppcud

    steps:
      - name: Configure SSR-safe invite template
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }

          template='<h2>Ative sua conta</h2><p>Use o link abaixo para ativar seu acesso.</p><p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite">Ativar conta</a></p>'
          body="$(jq -n --arg template "$template" '{mailer_templates_invite_content:$template}')"

          curl --fail-with-body --silent --show-error \
            -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$body" \
            >/dev/null

          after="$(curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"

          invite_template="$(printf '%s' "$after" | jq -r '.mailer_templates_invite_content // ""')"

          [[ "$invite_template" == *".TokenHash"* ]]
          [[ "$invite_template" == *"/auth/confirm"* ]]
          [[ "$invite_template" == *"type=invite"* ]]

          echo "Invite template uses TokenHash: true"
          echo "Invite template points to /auth/confirm: true"
          echo "Invite template sets type=invite: true"
