name: Configure Supabase leaked password protection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview current Auth password security or enable leaked password protection"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
      confirmation:
        description: "For apply mode, type ENABLE_HIBP exactly"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-auth-config
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_ID: hqanoskwjvpbgavppcud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate management credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Missing SUPABASE_ACCESS_TOKEN"
            exit 1
          }

      - name: Require explicit apply confirmation
        if: inputs.mode == 'apply'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "ENABLE_HIBP" || {
            echo "Apply mode requires confirmation=ENABLE_HIBP"
            exit 1
          }

      - name: Read current password security config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(
            curl --fail-with-body --silent --show-error               "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth"               -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          )"
          echo "$response" | jq '{
            password_hibp_enabled,
            password_min_length,
            password_required_characters
          }'

      - name: Enable leaked password protection
        if: inputs.mode == 'apply' && inputs.confirmation == 'ENABLE_HIBP'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -X PATCH             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data '{"password_hibp_enabled":true}'             | jq '{password_hibp_enabled}'

      - name: Verify leaked password protection
        if: inputs.mode == 'apply' && inputs.confirmation == 'ENABLE_HIBP'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          enabled="$(
            curl --fail-with-body --silent --show-error               "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth"               -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"               | jq -r '.password_hibp_enabled'
          )"
          test "$enabled" = "true" || {
            echo "Leaked password protection was not enabled"
            exit 1
          }
          echo "Leaked password protection enabled."
