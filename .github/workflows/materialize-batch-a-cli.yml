name: Materialize Batch A migration via Supabase CLI

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/materialize-batch-a-cli.yml"

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned project dependencies
        run: npm ci

      - name: Generate migration filename with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx supabase migration new seed_next_method_templates_batch_a
          find supabase/migrations -maxdepth 1 -type f -name '*_seed_next_method_templates_batch_a.sql' -print
