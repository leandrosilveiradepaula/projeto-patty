name: Materialize Batch A migration via Supabase CLI

on:
  push:
    branches:
      - codex/materialize-batch-a-cli
    paths:
      - ".github/workflows/materialize-batch-a-cli.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/materialize-batch-a-cli

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned project dependencies
        run: npm ci

      - name: Generate migration filename with Supabase CLI
        run: npx supabase migration new seed_next_method_templates_batch_a

      - name: Commit generated migration shell
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore: generate Batch A migration with Supabase CLI"
          git push
