name: Generate hydration migration name

on:
  push:
    branches:
      - codex/prepare-hydration-configuration
    paths:
      - .github/workflows/generate-hydration-migration-name.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci
      - name: Generate official migration filename
        shell: bash
        run: |
          set -euo pipefail
          npx supabase migration new hydrate_client_targets_from_configuration
          find supabase/migrations -maxdepth 1 -type f -name '*_hydrate_client_targets_from_configuration.sql' -printf '%f\n'
