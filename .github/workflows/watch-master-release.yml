name: Watch master release signals

# Read-only: alerts about missing CI/Vercel GitHub statuses after grace.
# Never deploys, changes aliases, updates issues, or runs client E2E.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: read

concurrency:
  group: patty-master-release-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'leandrosilveiradepaula/projeto-patty'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted master only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Validate read-only watcher syntax and regressions
        run: |
          node --check .github/scripts/release-watch.mjs
          node --test security/release-watch.test.mjs

      - name: Check latest master CI and Vercel statuses
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-watch.mjs
